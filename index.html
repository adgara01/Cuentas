  let xlsxLoadPromise = null;
  function loadXLSXLib(){
    if(typeof XLSX!=='undefined') return Promise.resolve();
    if(xlsxLoadPromise) return xlsxLoadPromise;
    xlsxLoadPromise = new Promise((resolve,reject)=>{
      const s = document.createElement('script');
      s.src = 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
      s.onload = ()=>resolve();
      s.onerror = ()=>{ xlsxLoadPromise=null; reject(new Error('load failed')); };
      document.head.appendChild(s);
    });
    return xlsxLoadPromise;
  }

  async function exportExcel(email){
    try{
      await loadXLSXLib();
    }catch(e){
      showToast('Sin conexión: no se pudo cargar el generador de Excel');
      return;
    }
    const movRows = [...state.transactions]
      .sort((a,b)=> a.date.localeCompare(b.date))
      .map(t=>({
        Fecha: t.date,
        Tipo: t.type,
        Cuenta: accName(t.account),
        'Cuenta destino': t.toAccount ? accName(t.toAccount) : '',
        Categoría: t.category,
        Importe: t.amount,
        Comentario: t.comment || ''
      }));
    const wsMov = XLSX.utils.json_to_sheet(movRows.length ? movRows : [{Fecha:'',Tipo:'',Cuenta:'',Categoría:'',Importe:'',Comentario:''}]);

    const months = allMonths();
    const aoa = [['GASTOS', ...months.map(monthLabel)]];
    state.categories.forEach(cat=>{
      aoa.push([cat, ...months.map(m=>{
        const total = state.transactions.filter(t=>t.type==='Gasto' && t.category===cat && monthKey(t.date)===m).reduce((s,t)=>s+t.amount,0);
        return total || 0;
      })]);
    });
    aoa.push([]);
    aoa.push(['INGRESOS', ...months.map(monthLabel)]);
    state.incomeCategories.forEach(cat=>{
      aoa.push([cat, ...months.map(m=>{
        const total = state.transactions.filter(t=>t.type==='Ingreso' && t.category===cat && monthKey(t.date)===m).reduce((s,t)=>s+t.amount,0);
        return total || 0;
      })]);
    });
    const wsResumen = XLSX.utils.aoa_to_sheet(aoa);

    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, wsMov, 'Movimientos');
    XLSX.utils.book_append_sheet(wb, wsResumen, 'Resumen mensual');
    const filename = 'cuentas_export_'+todayStr()+'.xlsx';
    XLSX.writeFile(wb, filename);

    if(email){
      const subject = encodeURIComponent('Exportación de Cuentas');
      const body = encodeURIComponent('Adjunta aquí el archivo "'+filename+'" que se acaba de descargar a tu dispositivo (revisa Descargas si no lo ves en el selector de adjuntos).');
      setTimeout(()=>{ window.location.href = 'mailto:'+email+'?subject='+subject+'&body='+body; }, 400);
    }
    showToast('Excel descargado');
  }

  let lastSavingsChart = null;
  let lastFiscalChart = null;
  function niceAxisTicks(minV, maxV, count){
    const span = maxV - minV || 1;
    const step = span / (count-1);
    const ticks = [];
    for(let i=0;i<count;i++) ticks.push(minV + step*i);
    return ticks;
  }
  function buildSavingsEvolutionChart(months){
    const accRem = state.accounts.find(a=>a.id==='remunerada') || state.accounts.find(a=>a.type==='ahorro' && !a.manual);
    if(!accRem || !months.length){ lastSavingsChart = null; return ''; }
    // "previsto": la nómina de un periodo se cobra el día 1 de ESE MISMO periodo (el día de cobro de Ajustes),
    // así que su aportación ya cuenta desde el principio del propio periodo, sin retraso.
    let cum = accRem.initial;
    const planned = months.map(m=>{ cum += goalAmountForMonth(m); return cum; });
    const todayM = nominaCurrentLabelMonth();
    const real = months.map(m=>{
      if(m > todayM) return null;
      if(m === todayM) return ledgerBalanceAsOfDate(accRem.id, todayStr());
      return ledgerBalanceAsOfDate(accRem.id, nominaPeriodForLabelMonth(m, state.paydayDay||1).end);
    });
    const allVals = planned.concat(real.filter(v=>v!=null));
    if(!allVals.length){ lastSavingsChart = null; return ''; }
    const minV = Math.min(0, Math.min(...allVals));
    const maxV = Math.max(...allVals, 1);
    const W = Math.max(320, months.length*38);
    const H = 190, padL=46, padR=14, padT=14, padB=28;
    const xStep = (W-padL-padR) / Math.max(1, months.length-1);
    const yScale = v => H-padB - ( (v-minV)/((maxV-minV)||1) ) * (H-padT-padB);
    const xPos = i => padL + i*xStep;
    function pathFor(arr){
      let d=''; let started=false;
      arr.forEach((v,i)=>{
        if(v==null) return;
        const x=xPos(i), y=yScale(v);
        d += (started?' L ':'M ') + x.toFixed(1) + ' ' + y.toFixed(1);
        started=true;
      });
      return d;
    }
    const plannedPath = pathFor(planned);
    const realPath = pathFor(real);
    const ticks = niceAxisTicks(minV, maxV, 4);

    // último punto real conocido = "estás aquí"
    let lastRealIdx = -1;
    for(let i=real.length-1;i>=0;i--){ if(real[i]!=null){ lastRealIdx=i; break; } }
    const currentDotHtml = lastRealIdx>=0
      ? `<circle cx="${xPos(lastRealIdx).toFixed(1)}" cy="${yScale(real[lastRealIdx]).toFixed(1)}" r="5" fill="var(--ink)" stroke="var(--cell)" stroke-width="2"/>`
      : '';

    lastSavingsChart = { months, planned, real, minV, maxV, W, H, padL, padR, padT, padB, xStep, accRem };

    return `<div class="chart-wrap" style="margin-top:12px;">
      <div class="chart-title">Evolución del ahorro — ${accRem.name} <span style="font-weight:400;text-transform:none;letter-spacing:0;">(toca o arrastra)</span></div>
      <div class="chart-subtitle">Cada mes es justo después de cobrar la nómina de ese mes.</div>
      <div style="overflow-x:auto;position:relative;" id="savingsScrollWrap">
        <svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" style="display:block;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;" id="savingsSvg">
          ${ticks.map(t=>{
            const y = yScale(t).toFixed(1);
            return `<line x1="${padL}" y1="${y}" x2="${W-padR}" y2="${y}" stroke="var(--line)" stroke-width="1"/>
                    <text x="${padL-6}" y="${(+y+3)}" font-size="8.5" fill="var(--muted)" text-anchor="end">${fmtWhole(t)}€</text>`;
          }).join('')}
          <path d="${plannedPath}" fill="none" stroke="var(--amber)" stroke-width="2" stroke-dasharray="5,4"/>
          <path d="${realPath}" fill="none" stroke="var(--green)" stroke-width="2.5"/>
          ${currentDotHtml}
          ${months.map((m,i)=>`<text x="${xPos(i).toFixed(1)}" y="${H-10}" font-size="9" fill="var(--muted)" text-anchor="middle" font-weight="700">${monthLabelShort(m)}</text>`).join('')}
          <line id="savingsVLine" x1="0" y1="${padT}" x2="0" y2="${H-padB}" stroke="var(--ink-soft)" stroke-width="1" style="opacity:0;"/>
          <circle id="savingsDotP" r="4" fill="var(--amber)" stroke="var(--cell)" stroke-width="1.5" style="opacity:0;"/>
          <circle id="savingsDotR" r="4" fill="var(--green)" stroke="var(--cell)" stroke-width="1.5" style="opacity:0;"/>
        </svg>
        <div class="chart-tooltip" id="savingsTooltip" style="display:none;"></div>
      </div>
      <div class="day-chart-legend" style="margin-top:10px;">
        <span><i class="legend-dot" style="background:var(--ink);border-radius:50%;"></i>Ahora</span>
        <span><i class="legend-dot" style="background:var(--green);border-radius:2px;"></i>Real</span>
        <span><i class="legend-dot" style="background:var(--amber);border-radius:2px;"></i>Previsto</span>
      </div>
    </div>`;
  }
  function wireSavingsChartInteractivity(){
    const d = lastSavingsChart;
    const svg = document.getElementById('savingsSvg');
    if(!d || !svg) return;
    const tooltip = document.getElementById('savingsTooltip');
    const vline = document.getElementById('savingsVLine');
    const dotP = document.getElementById('savingsDotP');
    const dotR = document.getElementById('savingsDotR');
    const yScale = v => d.H-d.padB - ( (v-d.minV)/((d.maxV-d.minV)||1) ) * (d.H-d.padT-d.padB);
    const xPos = i => d.padL + i*d.xStep;

    function showAt(clientX){
      const rect = svg.getBoundingClientRect();
      const scale = rect.width / d.W; // por si el navegador escala el svg
      const x = (clientX - rect.left) / scale;
      let idx = Math.round((x - d.padL) / d.xStep);
      idx = Math.max(0, Math.min(d.months.length-1, idx));
      const px = xPos(idx);
      vline.setAttribute('x1', px); vline.setAttribute('x2', px);
      vline.style.opacity = 1;
      let html = `<b>${monthLabel(d.months[idx])}</b>`;
      if(d.real[idx]!=null){
        dotR.setAttribute('cx', px); dotR.setAttribute('cy', yScale(d.real[idx]));
        dotR.style.opacity = 1;
        html += `<br>Real: ${fmtWhole(d.real[idx])}€`;
      } else {
        dotR.style.opacity = 0;
      }
      dotP.setAttribute('cx', px); dotP.setAttribute('cy', yScale(d.planned[idx]));
      dotP.style.opacity = 1;
      html += `<br>Previsto: ${fmtWhole(d.planned[idx])}€`;
      tooltip.innerHTML = html;
      tooltip.style.display = 'block';
      tooltip.style.left = px+'px';
    }
    function hide(){
      vline.style.opacity = 0; dotP.style.opacity = 0; dotR.style.opacity = 0;
      tooltip.style.display = 'none';
    }
    svg.onpointermove = e=> showAt(e.clientX);
    svg.onpointerdown = e=> showAt(e.clientX);
    svg.onpointerleave = hide;
    svg.addEventListener('touchstart', e=>{ if(e.touches[0]){ e.preventDefault(); showAt(e.touches[0].clientX); } }, {passive:false});
    svg.addEventListener('touchmove', e=>{ if(e.touches[0]){ e.preventDefault(); showAt(e.touches[0].clientX); } }, {passive:false});
    svg.ontouchend = hide;
    svg.oncontextmenu = e=> e.preventDefault();
    svg.addEventListener('selectstart', e=> e.preventDefault());
  }

  function wireFiscalChartInteractivity(){
    const d = lastFiscalChart;
    const bars = document.getElementById('fiscalChartBars');
    if(!d || !bars) return;
    const tooltip = document.getElementById('fiscalTooltip');
    let downX = null, downIdx = null;
    function idxAt(clientX){
      const rect = bars.getBoundingClientRect();
      const frac = Math.max(0, Math.min(0.9999, (clientX - rect.left) / rect.width));
      return Math.floor(frac * d.days.length);
    }
    function showAt(clientX){
      const rect = bars.getBoundingClientRect();
      const idx = idxAt(clientX);
      const day = d.days[idx];
      if(!day) return;
      const px = (idx+0.5)/d.days.length * rect.width;
      let html = `<b>${dowShort(day.date)} ${day.date.slice(8)}/${day.date.slice(5,7)}</b>`;
      if(day.gastoTotal>0) html += `<br>Gasto: ${fmt(day.gastoTotal)}€`;
      if(day.ingreso>0) html += `<br>Ingreso: ${fmt(day.ingreso)}€`;
      if(day.gastoTotal<=0 && day.ingreso<=0) html += `<br>Sin movimientos`;
      tooltip.innerHTML = html;
      tooltip.style.display = 'block';
      tooltip.style.left = px+'px';
    }
    function hide(){ tooltip.style.display = 'none'; }
    function selectDayAt(clientX){
      const idx = idxAt(clientX);
      const day = d.days[idx];
      if(!day) return;
      dashFilters.dateMode = 'custom';
      dashFilters.customStart = day.date;
      dashFilters.customEnd = day.date;
      presetActive = false;
      renderDashboard();
      showToast('Filtrado por '+day.label);
    }
    bars.onpointermove = e=> showAt(e.clientX);
    bars.onpointerdown = e=>{ downX = e.clientX; downIdx = idxAt(e.clientX); showAt(e.clientX); };
    bars.onpointerup = e=>{
      if(downX!=null && Math.abs(e.clientX-downX) < 8) selectDayAt(e.clientX);
      downX = null;
    };
    bars.onpointerleave = hide;
    bars.addEventListener('touchstart', e=>{ if(e.touches[0]){ e.preventDefault(); downX = e.touches[0].clientX; showAt(e.touches[0].clientX); } }, {passive:false});
    bars.addEventListener('touchmove', e=>{ if(e.touches[0]){ e.preventDefault(); showAt(e.touches[0].clientX); } }, {passive:false});
    bars.addEventListener('touchend', e=>{
      const x = e.changedTouches && e.changedTouches[0] ? e.changedTouches[0].clientX : null;
      if(x!=null && downX!=null && Math.abs(x-downX) < 8) selectDayAt(x);
      downX = null;
      hide();
    });
    bars.oncontextmenu = e=> e.preventDefault();
    bars.addEventListener('selectstart', e=> e.preventDefault());
  }

  function getTheme(){ try{ const t = localStorage.getItem('cuentas-theme'); return (t==='dark'||t==='light') ? t : 'auto'; }catch(e){ return 'auto'; } }
  function applyTheme(t){
    const root = document.documentElement;
    if(t==='dark'||t==='light') root.setAttribute('data-theme', t); else root.removeAttribute('data-theme');
    try{ if(t==='auto') localStorage.removeItem('cuentas-theme'); else localStorage.setItem('cuentas-theme', t); }catch(e){}
    const dark = t==='dark' || (t==='auto' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
    const meta = document.querySelector('meta[name="theme-color"]');
    if(meta) meta.setAttribute('content', dark ? '#0E0F11' : '#F3F4F6');
  }
  applyTheme(getTheme());
  if(window.matchMedia) window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', ()=>{ if(getTheme()==='auto') applyTheme('auto'); });

  function renderAjustes(){

    const contiguous = [];
    { let cur = rangeStart; let guard=0; while(cur<=rollingEnd && guard<240){ contiguous.push(cur); cur = nextMonthKey(cur); guard++; } }
    const planMonths = Array.from(new Set([...contiguous, ...txMonths, ...Object.keys(state.monthlyPlans)])).sort();
    const previsionMonths = forecastMonths();

      `);

    html += collapsibleCard('apariencia', 'Apariencia', `

        <button data-th="auto" class="${getTheme()==='auto'?'active':''}">Automático</button>
        <button data-th="light" class="${getTheme()==='light'?'active':''}">Claro</button>

      <div class="plan-table-wrap"><table class="plan-table-fixed">

    html += collapsibleCard('preset', 'Preset de filtros', `

      <div class="filter-label" style="margin-top:0;">Tipo</div>
      <div class="filter-chip-row">
        ${['Gasto','Ingreso','Movimiento'].map(t=>`<div class="fchip preset-edit-chip ${state.filterPreset.types.includes(t)?'active':''}" data-field="types" data-val="${t}">${t}</div>`).join('')}

      <div class="filter-label">Cuenta</div>
      <div class="filter-chip-row">
        ${state.accounts.filter(a=>!a.manual).map(a=>`<div class="fchip preset-edit-chip ${state.filterPreset.accounts.includes(a.id)?'active':''}" data-field="accounts" data-val="${a.id}">${a.name}</div>`).join('')}

      <div class="filter-label">Categoría</div>
      <div class="filter-chip-row">
        ${[...state.categories, ...state.incomeCategories].map(c=>`<div class="fchip preset-edit-chip ${state.filterPreset.categories.includes(c)?'active':''}" data-field="categories" data-val="${c}">${c}</div>`).join('')}
      </div>
    `);

    html += collapsibleCard('logGasto', 'Log mensual por categoría (gastos)', `
      <div class="pivot-wrap"><table class="pivot">
        <thead><tr><th>Categoría</th>${planMonths.map(m=>`<th>${monthLabel(m)}</th>`).join('')}</tr></thead>
        <tbody>
          ${state.categories.map(cat=>{
            const cells = planMonths.map(m=>{
              const total = state.transactions.filter(t=>t.type==='Gasto' && t.category===cat && monthKey(t.date)===m).reduce((s,t)=>s+t.amount,0);
              return `<td>${total? fmt(total) : '—'}</td>`;
            }).join('');
            return `<tr><td>${cat}</td>${cells}</tr>`;
          }).join('')}
        </tbody>
      </table></div>
    `);

    html += collapsibleCard('logIngreso', 'Log mensual por categoría (ingresos)', `
      <div class="pivot-wrap"><table class="pivot">
        <thead><tr><th>Categoría</th>${planMonths.map(m=>`<th>${monthLabel(m)}</th>`).join('')}</tr></thead>
        <tbody>
          ${state.incomeCategories.map(cat=>{
            const cells = planMonths.map(m=>{
              const total = state.transactions.filter(t=>t.type==='Ingreso' && t.category===cat && monthKey(t.date)===m).reduce((s,t)=>s+t.amount,0);
              return `<td>${total? fmt(total) : '—'}</td>`;
            }).join('');
            return `<tr><td>${cat}</td>${cells}</tr>`;
          }).join('')}
        </tbody>
      </table></div>
    `);

    html += collapsibleCard('export', 'Exportar a Excel', `
      <div class="field"><label>Correo para enviarlo</label><input type="email" id="exportEmail" value="${state.exportEmail||''}" placeholder="tucorreo@ejemplo.com"></div>
      <button class="btn-primary" id="exportBtn">Descargar y preparar correo</button>
      <div class="empty-note" style="padding:8px 0 0;">Descarga un .xlsx con "Movimientos" y "Resumen mensual", y abre un borrador de correo con el destinatario puesto — el archivo hay que adjuntarlo a mano, esta app no puede enviarlo sola.</div>
    `);

    $app.innerHTML = html;

    const syncNowBtn = document.getElementById('syncNowBtn');
    if(syncNowBtn) syncNowBtn.onclick = async ()=>{
      showToast('Sincronizando…');
      await syncWithCloud();
      showToast(syncStatus==='synced' ? 'Sincronizado' : 'Sin conexión');
      renderAjustes();
    };
    document.getElementById('accMailBtn').onclick = openChangeEmail;
    document.getElementById('accPwBtn').onclick = openChangePassword;
    document.getElementById('accKeyBtn').onclick = openShortcutKey;
    document.getElementById('logoutBtn').onclick = doLogout;

    document.getElementById('paydayInput').onchange = e=>{
      let v = parseInt(e.target.value,10)||1;
      v = Math.min(31, Math.max(1,v));
      state.paydayDay = v;
      saveState(); renderAjustes();
    };
    function updatePlanHint(m){
      const incomeInput = document.querySelector('.plan-income[data-m="'+m+'"]');
      const goalInput = document.querySelector('.plan-goal[data-m="'+m+'"]');
      const hint = document.getElementById('hint-'+m);
      if(!incomeInput || !goalInput || !hint) return;
      const incomeVal = incomeInput.value!=='' ? (parseFloat(incomeInput.value)||0) : incomeForMonth(m);
      const pctVal = goalInput.value!=='' ? (parseFloat(goalInput.value)||0) : 0;
      hint.textContent = '≈ '+fmt(incomeVal*(pctVal/100))+'€';
    }
    $app.querySelectorAll('.plan-month-btn').forEach(el=>{
      el.onclick = ()=> openCategoryBudgetSheet(el.dataset.m);
    });
    $app.querySelectorAll('.plan-income').forEach(inp=>{
      inp.addEventListener('input', ()=> updatePlanHint(inp.dataset.m));
      inp.onchange = e=>{
        const m = e.target.dataset.m;
        if(!state.monthlyPlans[m]) state.monthlyPlans[m] = {};
        state.monthlyPlans[m].income = e.target.value==='' ? null : (parseFloat(e.target.value)||0);
        saveState();
      };
    });
    $app.querySelectorAll('.plan-goal').forEach(inp=>{
      inp.addEventListener('input', ()=> updatePlanHint(inp.dataset.m));
      inp.onchange = e=>{
        const m = e.target.dataset.m;
        if(!state.monthlyPlans[m]) state.monthlyPlans[m] = {};
        const v = e.target.value==='' ? null : Math.min(100, Math.max(0, parseFloat(e.target.value)||0));
        state.monthlyPlans[m].savingsGoalPct = v;
        saveState();
      };
    });
    $app.querySelectorAll('[data-ajustes-toggle]').forEach(el=>{
      el.onclick = ()=>{ const k = el.dataset.ajustesToggle; ajustesOpen[k] = !ajustesOpen[k]; renderAjustes(); };
    });
    $app.querySelectorAll('.init-input').forEach(inp=>{
      inp.onchange = e=>{
        const acc = state.accounts.find(a=>a.id===e.target.dataset.acc);
        acc.initial = parseFloat(e.target.value)||0;
        saveState(); renderAjustes();
      };
    });
    $app.querySelectorAll('.manual-input').forEach(inp=>{
      inp.onchange = e=>{
        const acc = state.accounts.find(a=>a.id===e.target.dataset.acc);
        acc.manualBalance = parseFloat(e.target.value)||0;
        saveState(); renderAjustes();
      };
    });
    document.querySelectorAll('#themeSeg button').forEach(b=>{
      b.onclick = ()=>{ applyTheme(b.dataset.th); document.querySelectorAll('#themeSeg button').forEach(x=>x.classList.toggle('active', x===b)); };
    });
    document.getElementById('addAccBtn').onclick = ()=>{
      let newType = 'corriente';
      let newManual = false;
      function drawNewAccSheet(){
        $sheet.innerHTML = `
          <h2>Nueva cuenta <span class="close-x" id="closeX">✕</span></h2>
          <div class="field"><label>Nombre</label><input type="text" id="newAccName" placeholder="ej. Revolut"></div>
          <div class="field">
            <label>Tipo</label>
            <div class="seg" id="newAccTypeSeg">
              <button data-t="corriente" class="${newType==='corriente'?'active':''}">Corriente</button>
              <button data-t="ahorro" class="${newType==='ahorro'?'active':''}">Ahorro</button>
            </div>
          </div>
          <div class="field">
            <label>¿Cómo se actualiza el saldo?</label>
            <div class="seg" id="newAccManualSeg">
              <button data-m="auto" class="${!newManual?'active':''}">Automático</button>
              <button data-m="manual" class="${newManual?'active':''}">Manual</button>
            </div>
          </div>
          <button class="btn-primary" id="newAccCreateBtn">Crear cuenta</button>
        `;
        $overlay.classList.add('show');
        document.getElementById('closeX').onclick = ()=> $overlay.classList.remove('show');
        document.querySelectorAll('#newAccTypeSeg button').forEach(b=>{
          b.onclick = ()=>{ newType = b.dataset.t; drawNewAccSheet(); };
        });
        const manualSeg = document.getElementById('newAccManualSeg');
        if(manualSeg) manualSeg.querySelectorAll('button').forEach(b=>{
          b.onclick = ()=>{ newManual = b.dataset.m==='manual'; drawNewAccSheet(); };
        });
        document.getElementById('newAccCreateBtn').onclick = ()=>{
          const name = document.getElementById('newAccName').value.trim();
          if(!name){ showToast('Escribe un nombre'); return; }
          state.accounts.push({id:uid(), name, type:newType, manual:newManual, initial:0, manualBalance:0, expected:0});

          renderAjustes();

    $app.querySelectorAll('.acc-manage-btn').forEach(row=>{
      row.onclick = ()=>{

        let editType = acc.type;
        let editManual = acc.manual;
        function drawEditSheet(){
          $sheet.innerHTML = `
            <h2>Editar cuenta <span class="close-x" id="closeX">✕</span></h2>
            <div class="field"><label>Nombre</label><input type="text" id="editAccName" value="${acc.name}"></div>
            <div class="field">
              <label>Tipo</label>
              <div class="seg" id="editAccTypeSeg">

                <button data-t="ahorro" class="${editType==='ahorro'?'active':''}">Ahorro</button>
              </div>
            </div>
            <div class="field">
              <label>¿Cómo se actualiza el saldo?</label>
              <div class="seg" id="editAccManualSeg">
                <button data-m="auto" class="${!editManual?'active':''}">Automático</button>
                <button data-m="manual" class="${editManual?'active':''}">Manual</button>
              </div>
            </div>
            <button class="btn-primary" id="accSaveBtn">Guardar cambios</button>
            <button class="btn-secondary" id="accDeleteBtn">Eliminar cuenta</button>

          $overlay.classList.add('show');
          document.getElementById('closeX').onclick = ()=> $overlay.classList.remove('show');
          document.querySelectorAll('#editAccTypeSeg button').forEach(b=>{
            b.onclick = ()=>{ editType = b.dataset.t; drawEditSheet(); };

        drawEditSheet();

    $app.querySelectorAll('#renameGastoChips .fchip, #renameIngresoChips .fchip').forEach(chip=>{
      chip.onclick = ()=>{

        const name = list[idx];

          <h2>${name} <span class="close-x" id="closeX">✕</span></h2>

        document.getElementById('closeX').onclick = ()=> $overlay.classList.remove('show');

          const trimmed = newName.trim();

          list[idx] = trimmed;
          state.transactions.forEach(t=>{ if(t.category===name) t.category = trimmed; });
          if(listName==='categories'){
            state.expenseGroups.forEach(g=>{ g.categories = g.categories.map(c=>c===name?trimmed:c); });
            Object.values(state.monthlyPlans).forEach(p=>{
              if(p.catBudget && p.catBudget[name]!==undefined){
                p.catBudget[trimmed] = p.catBudget[name];
                delete p.catBudget[name];
              }
            });

          saveState();
          showToast('Categoría renombrada');
          renderAjustes();
        };
        document.getElementById('catDeleteBtn').onclick = ()=>{
          const linked = state.transactions.filter(t=>t.category===name).length;
          const msg = linked>0
            ? '¿Eliminar "'+name+'"? Tiene '+linked+' movimiento(s) con esta categoría, que se quedarán con una categoría que ya no existe en la lista.'
            : '¿Eliminar "'+name+'"?';
          if(!confirm(msg)){ return; }
          list.splice(idx,1);

            state.expenseGroups.forEach(g=>{ g.categories = g.categories.filter(c=>c!==name); });
            Object.values(state.monthlyPlans).forEach(p=>{ if(p.catBudget) delete p.catBudget[name]; });
          }
          saveState();
          $overlay.classList.remove('show');
          showToast('Categoría eliminada');
          renderAjustes();
        };
      };
    });
    const addCatGastoBtn = document.getElementById('addCatGastoBtn');
    if(addCatGastoBtn) addCatGastoBtn.onclick = ()=>{
      $sheet.innerHTML = `
        <h2>Nueva categoría de gasto <span class="close-x" id="closeX">✕</span></h2>
        <div class="field"><label>Nombre</label><input type="text" id="newCatName" placeholder="ej. Mascota"></div>
        <button class="btn-primary" id="newCatCreateBtn">Crear categoría</button>
      `;
      $overlay.classList.add('show');
      document.getElementById('closeX').onclick = ()=> $overlay.classList.remove('show');
      document.getElementById('newCatCreateBtn').onclick = ()=>{
        const trimmed = document.getElementById('newCatName').value.trim();
        if(!trimmed){ showToast('Escribe un nombre'); return; }
        if(state.categories.includes(trimmed)){ showToast('Ya existe'); return; }
        state.categories.push(trimmed);
        saveState();
        $overlay.classList.remove('show');
        showToast('Categoría añadida');
        renderAjustes();
      };
    };
    const addCatIngresoBtn = document.getElementById('addCatIngresoBtn');
    if(addCatIngresoBtn) addCatIngresoBtn.onclick = ()=>{
      $sheet.innerHTML = `
        <h2>Nueva categoría de ingreso <span class="close-x" id="closeX">✕</span></h2>
        <div class="field"><label>Nombre</label><input type="text" id="newCatName" placeholder="ej. Devolución"></div>
        <button class="btn-primary" id="newCatCreateBtn">Crear categoría</button>
      `;
      $overlay.classList.add('show');
      document.getElementById('closeX').onclick = ()=> $overlay.classList.remove('show');
      document.getElementById('newCatCreateBtn').onclick = ()=>{
        const trimmed = document.getElementById('newCatName').value.trim();
        if(!trimmed){ showToast('Escribe un nombre'); return; }
        if(state.incomeCategories.includes(trimmed)){ showToast('Ya existe'); return; }
        state.incomeCategories.push(trimmed);
        saveState();
        $overlay.classList.remove('show');
        showToast('Categoría añadida');
        renderAjustes();
      };
    };
    $app.querySelectorAll('.group-name-btn').forEach(el=>{
      el.onclick = ()=>{
        const gi = parseInt(el.dataset.gidx,10);
        const g = state.expenseGroups[gi];
        const newName = prompt('Nombre de la agrupación:', g.name);
        if(!newName || !newName.trim() || newName.trim()===g.name) return;
        g.name = newName.trim();
        saveState();
        renderAjustes();
      };
    });
    $app.querySelectorAll('.group-del-btn').forEach(el=>{
      el.onclick = ()=>{
        const gi = parseInt(el.dataset.gidx,10);
        const g = state.expenseGroups[gi];
        if(!confirm('¿Eliminar la agrupación "'+g.name+'"? Sus categorías pasarán a "Otros".')) return;
        state.expenseGroups.splice(gi,1);
        saveState();
        renderAjustes();
      };
    });
    $app.querySelectorAll('.group-cat-chip').forEach(el=>{
      el.onclick = ()=>{
        const gi = parseInt(el.dataset.gidx,10);
        const cat = el.dataset.cat;
        const g = state.expenseGroups[gi];
        if(g.categories.includes(cat)){
          g.categories = g.categories.filter(c=>c!==cat);
        } else {
          state.expenseGroups.forEach(og=>{ og.categories = og.categories.filter(c=>c!==cat); });
          g.categories.push(cat);
        }
        saveState();
        renderAjustes();
      };
    });
    const addGroupBtn = document.getElementById('addGroupBtn');
    if(addGroupBtn) addGroupBtn.onclick = ()=>{
      const name = prompt('Nombre de la nueva agrupación:');
      if(!name || !name.trim()) return;
      state.expenseGroups.push({id:uid(), name:name.trim(), categories:[]});
      saveState();
      showToast('Agrupación creada — toca sus categorías para añadirlas');
      renderAjustes();
    };
    $app.querySelectorAll('.preset-edit-chip').forEach(el=>{
      el.onclick = ()=>{
        const field = el.dataset.field;
        const val = el.dataset.val;
        if(!state.filterPreset[field]) state.filterPreset[field] = [];
        if(state.filterPreset[field].includes(val)) state.filterPreset[field] = state.filterPreset[field].filter(v=>v!==val);
        else state.filterPreset[field].push(val);
        saveState();
        renderAjustes();
      };
    });
    document.getElementById('exportBtn').onclick = ()=>{
      const emailInput = document.getElementById('exportEmail');
      const email = emailInput.value.trim();
      if(email && !/^\S+@\S+\.\S+$/.test(email)){
        showToast('Correo no válido');
        return;
      }
      state.exportEmail = email;
      saveState();
      exportExcel(email);
    };
  }

  // ================= EDIT SHEET =================
  function openEditSheet(id, refreshFn){
    const editing = state.transactions.find(t=>t.id===id);
    if(!editing) return;
    let type = editing.type;
    let account = editing.account;
    let toAccount = editing.toAccount || state.accounts[0].id;
    let category = editing.category;
    const catList = type==='Ingreso' ? state.incomeCategories : state.categories;
    const transactable = state.accounts.filter(a=>!a.manual || a.id===account || a.id===toAccount);

    function accountOptionsHtml(sel, excludeId){
      return transactable.filter(a=>a.id!==excludeId).map(a=>`<option value="${a.id}" ${a.id===sel?'selected':''}>${a.name}</option>`).join('');
    }

    $sheet.innerHTML = `
      <h2>Editar movimiento <span class="close-x" id="editCloseX">✕</span></h2>
      <div class="field"><label>Cantidad</label><input class="mono-input" type="number" step="0.01" id="edit-tx-amount" value="${editing.amount}"></div>
      <div class="two-col">
        <div class="field"><label>${type==='Movimiento'?'Desde cuenta':'Cuenta'}</label><select id="edit-tx-account">${accountOptionsHtml(account)}</select></div>
        ${type==='Movimiento' ? `<div class="field"><label>A cuenta</label><select id="edit-tx-toaccount">${accountOptionsHtml(toAccount, account)}</select></div>` : `<div class="field"><label>Fecha</label><input type="date" id="edit-tx-date" value="${editing.date}"></div>`}
      </div>
      ${type==='Movimiento' ? `<div class="field"><label>Fecha</label><input type="date" id="edit-tx-date" value="${editing.date}"></div>` : ''}
      ${type!=='Movimiento' ? `<div class="field"><label>Categoría</label><div class="chip-row" id="editCatChips">${catList.map(c=>`<div class="chip ${c===category?'active':''}" data-cat="${c}">${c}</div>`).join('')}</div></div>` : ''}
      <div class="field"><label>Comentario</label><input type="text" id="edit-tx-comment" value="${editing.comment||''}"></div>
      ${type==='Gasto' ? `
      <label class="check-row">
        <input type="checkbox" id="edit-tx-extra" ${editing.extraordinary?'checked':''}>
        <span>Gasto extraordinario</span>
      </label>` : ''}
      <button class="btn-primary" id="editTxSave">Guardar cambios</button>
      <button class="btn-secondary" id="editTxDelete">Eliminar movimiento</button>
    `;
    $overlay.classList.add('show');
    $sheet.querySelector('#editCloseX').onclick = ()=> $overlay.classList.remove('show');

    $sheet.querySelectorAll('#editCatChips .chip').forEach(chip=>{
      chip.onclick = ()=>{
        category = chip.dataset.cat;
        $sheet.querySelectorAll('#editCatChips .chip').forEach(c=>c.classList.remove('active'));
        chip.classList.add('active');
      };
    });

    const editAccEl = $sheet.querySelector('#edit-tx-account');
    if(editAccEl && type==='Movimiento'){
      editAccEl.onchange = (e)=>{
        account = e.target.value;
        if(toAccount===account){
          const alt = transactable.find(a=>a.id!==account);
          if(alt) toAccount = alt.id;
        }
        const toEl = $sheet.querySelector('#edit-tx-toaccount');
        if(toEl) toEl.innerHTML = accountOptionsHtml(toAccount, account);
      };
    }

    $sheet.querySelector('#editTxSave').onclick = async ()=>{
      const amount = parseFloat($sheet.querySelector('#edit-tx-amount').value);
      if(!amount || amount<=0){ showToast('Pon una cantidad válida'); return; }
      const accEl = $sheet.querySelector('#edit-tx-account');
      const toEl = $sheet.querySelector('#edit-tx-toaccount');
      const date = $sheet.querySelector('#edit-tx-date').value;
      const comment = $sheet.querySelector('#edit-tx-comment').value.trim();
      const acc = accEl.value;
      const toAcc = toEl ? toEl.value : undefined;
      const extraEl = $sheet.querySelector('#edit-tx-extra');
      if(type==='Movimiento' && acc===toAcc){ showToast('Elige dos cuentas distintas'); return; }

      editing.amount = amount;
      editing.account = acc;
      editing.date = date;
      editing.comment = comment;
      editing.extraordinary = (type==='Gasto' && extraEl && extraEl.checked) ? true : undefined;
      if(type==='Movimiento'){
        editing.toAccount = toAcc;
        editing.category = state.accounts.find(a=>a.id===toAcc)?.type==='ahorro' ? 'Ahorro' : 'Transferencia';
      } else {
        editing.category = category;
      }
      await saveState();
      $overlay.classList.remove('show');
      showToast('Movimiento actualizado');
      if(refreshFn) refreshFn(); else render();
    };
    $sheet.querySelector('#editTxDelete').onclick = async ()=>{
      state.transactions = state.transactions.filter(t=>t.id!==editing.id);
      await saveState();
      $overlay.classList.remove('show');
      showToast('Movimiento eliminado');
      if(refreshFn) refreshFn(); else render();
    };
  }
  $overlay.onclick = (e)=>{ if(e.target===$overlay) $overlay.classList.remove('show'); };

  // ================= AÑO (dashboard anual) =================
  let anualYear = null, anualMode = 'natural';
  const MES3 = ['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];
  function anualKey(dateStr){ return anualMode==='nomina' ? nominaPeriodLabelForDate(dateStr) : monthKey(dateStr); }
  function anualStats(year){
    const months = Array.from({length:12}, ()=>({ing:0,gas:0,extra:0}));
    const cats = {};
    state.transactions.forEach(t=>{
      if(t.type==='Movimiento') return;
      const k = anualKey(t.date);
      if(k.slice(0,4)!==String(year)) return;
      const m = parseInt(k.slice(5,7),10)-1;
      if(t.type==='Ingreso') months[m].ing += t.amount;
      else { months[m].gas += t.amount; if(t.extraordinary) months[m].extra += t.amount; cats[t.category] = (cats[t.category]||0)+t.amount; }
    });
    return { months, cats, ing: months.reduce((s,m)=>s+m.ing,0), gas: months.reduce((s,m)=>s+m.gas,0) };
  }
  function anualEndDate(year, mi){
    if(anualMode==='nomina'){
      const lbl = year+'-'+String(mi+1).padStart(2,'0');
      return nominaPeriodForLabelMonth(lbl, state.paydayDay||1).end;
    }
    return isoDate(new Date(year, mi+1, 0));
  }
  function renderAnual(){
    const curKey = anualMode==='nomina' ? nominaCurrentLabelMonth() : todayMonthKey();
    const years = new Set(state.transactions.filter(t=>t.type!=='Movimiento').map(t=>anualKey(t.date).slice(0,4)));
    years.add(curKey.slice(0,4));
    const yearList = Array.from(years).sort();
    if(!anualYear || !yearList.includes(String(anualYear))) anualYear = parseInt(curKey.slice(0,4),10);
    const Y = anualYear;
    const st = anualStats(Y), prev = anualStats(Y-1);
    const isCurYear = String(Y)===curKey.slice(0,4);
    const monthsElapsed = isCurYear ? parseInt(curKey.slice(5,7),10) : (Y < parseInt(curKey.slice(0,4),10) ? 12 : 0);
    const lastIdx = monthsElapsed-1;
    const net = st.ing - st.gas;
    const rate = st.ing>0 ? (net/st.ing)*100 : 0;
    const avgGas = monthsElapsed>0 ? st.gas/monthsElapsed : 0;
    const delta = (a,b,goodUp)=>{
      if(!b) return '<span class="kpi-d" style="color:var(--muted);">sin año anterior</span>';
      const d = ((a-b)/Math.abs(b))*100;
      const good = goodUp ? d>=0 : d<=0;
      return `<span class="kpi-d" style="color:${good?'var(--green)':'var(--red)'};">${d>=0?'▲':'▼'} ${Math.abs(d).toFixed(0)}% vs ${Y-1}</span>`;
    };
    // acumulados y saldo mes a mes
    let acc = 0;
    const rows = st.months.map((m,i)=>{
      const has = i<=lastIdx || m.ing>0 || m.gas>0;
      const n = m.ing - m.gas;
      if(has) acc += n;
      let saldo = null;
      if(i<=lastIdx || Y<parseInt(curKey.slice(0,4),10)){
        const cut = anualEndDate(Y,i);
        saldo = state.accounts.filter(a=>!a.manual).reduce((s,a)=>s+ledgerBalanceAsOfDate(a.id,cut),0);
      }
      return { i, ing:m.ing, gas:m.gas, net:n, acc: has?acc:null, saldo, has };
    });
    const withData = rows.filter(r=>r.has && (r.ing>0||r.gas>0));
    const best = withData.length ? withData.reduce((a,b)=>b.net>a.net?b:a) : null;
    const worst = withData.length ? withData.reduce((a,b)=>b.net<a.net?b:a) : null;

    // gráficos SVG: (1) barras ingresos/gastos, (2) línea de ahorro acumulado
    const W=600,PL=44,PR=10,PT=14,PB=26;
    const cw = (W-PL-PR)/12;
    function frame(H, minV, maxV){
      const raw=(maxV-minV)/4; const pw=Math.pow(10,Math.floor(Math.log10(raw||1))); const f=raw/pw;
      const step=(f<=1?1:f<=2?2:f<=5?5:10)*pw;
      const top=Math.ceil(maxV/step)*step, bot=Math.floor(minV/step)*step;
      const yOf = v => PT + (1-((v-bot)/((top-bot)||1)))*(H-PT-PB);
      let g='';
      for(let v=bot; v<=top+1e-9; v+=step){
        g += `<line x1="${PL}" x2="${W-PR}" y1="${yOf(v)}" y2="${yOf(v)}" stroke="var(--line)" stroke-width="1"/><text x="${PL-6}" y="${yOf(v)+3}" text-anchor="end" font-size="9" fill="var(--muted)">${Math.abs(v)>=1000?(v/1000).toFixed(v%1000?1:0)+'k':Math.round(v)}</text>`;
      }
      g += `<line x1="${PL}" x2="${W-PR}" y1="${yOf(0)}" y2="${yOf(0)}" stroke="var(--muted)" stroke-width="1"/>`;
      rows.forEach(r=>{ g += `<text x="${PL+r.i*cw+cw/2}" y="${H-8}" text-anchor="middle" font-size="9.5" fill="var(--ink-soft)">${MES3[r.i]}</text>`; });
      return { yOf, g };
    }
    const H1=210;
    const maxBar = Math.max(1, ...rows.map(r=>Math.max(r.ing,r.gas)));
    const f1 = frame(H1, 0, maxBar);
    let svg = `<svg viewBox="0 0 ${W} ${H1}" class="anual-svg" role="img" aria-label="Ingresos y gastos por mes">${f1.g}`;
    rows.forEach(r=>{
      const x0 = PL + r.i*cw, bw = cw*0.34;
      svg += `<g><title>${MES3[r.i]} ${Y}: ingresos ${fmt(r.ing)}€ · gastos ${fmt(r.gas)}€ · neto ${fmt(r.net)}€</title>`;
      if(r.ing>0) svg += `<rect x="${x0+cw*0.13}" y="${f1.yOf(r.ing)}" width="${bw}" height="${f1.yOf(0)-f1.yOf(r.ing)}" rx="2" fill="var(--green)" opacity="0.9"/>`;
      if(r.gas>0) svg += `<rect x="${x0+cw*0.13+bw+2}" y="${f1.yOf(r.gas)}" width="${bw}" height="${f1.yOf(0)-f1.yOf(r.gas)}" rx="2" fill="var(--red)" opacity="0.9"/>`;
      svg += `<rect x="${x0}" y="${PT}" width="${cw}" height="${H1-PT-PB}" fill="transparent"/></g>`;
    });
    svg += `</svg>`;
    const accVals = rows.filter(r=>r.acc!=null).map(r=>r.acc);
    const H2=170;
    const f2 = frame(H2, Math.min(0,...accVals,0), Math.max(1,...accVals));
    const pts = rows.filter(r=>r.acc!=null).map(r=>[PL+r.i*cw+cw/2, f2.yOf(r.acc)]);
    let svg2 = `<svg viewBox="0 0 ${W} ${H2}" class="anual-svg" role="img" aria-label="Ahorro acumulado">${f2.g}`;
    if(pts.length>1){
      svg2 += `<polygon points="${pts[0][0]},${f2.yOf(0)} ${pts.map(q=>q[0].toFixed(1)+','+q[1].toFixed(1)).join(' ')} ${pts[pts.length-1][0]},${f2.yOf(0)}" fill="var(--cat-violet)" opacity="0.12"/>`;
      svg2 += `<polyline points="${pts.map(q=>q[0].toFixed(1)+','+q[1].toFixed(1)).join(' ')}" fill="none" stroke="var(--cat-violet)" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>`;
    }
    rows.filter(r=>r.acc!=null).forEach(r=>{ svg2 += `<circle cx="${PL+r.i*cw+cw/2}" cy="${f2.yOf(r.acc)}" r="3" fill="var(--cat-violet)"><title>Ahorro acumulado hasta ${MES3[r.i]}: ${fmt(r.acc)}€</title></circle>`; });
    svg2 += `</svg>`;

    const catEntries = Object.entries(st.cats).sort((a,b)=>b[1]-a[1]);
    const maxCat = Math.max(1, ...catEntries.map(e=>e[1]));
    const catHtml = catEntries.length ? catEntries.map(([c,v])=>{
      const pv = prev.cats[c]||0;
      const d = pv ? ` <span style="color:${v<=pv?'var(--green)':'var(--red)'};font-size:10.5px;font-weight:700;">${v>=pv?'▲':'▼'}${Math.abs(((v-pv)/pv)*100).toFixed(0)}%</span>` : '';
      return `<div style="margin-bottom:10px;">
        <div style="display:flex;justify-content:space-between;font-size:12.5px;font-weight:600;margin-bottom:3px;"><span>${c}</span><span class="mono">${fmt(v)}€${d}</span></div>
        <div style="height:8px;border-radius:4px;background:var(--bg);"><div style="height:8px;border-radius:4px;width:${(v/maxCat*100).toFixed(1)}%;background:var(--red-mid);"></div></div>
      </div>`; }).join('') : '<div class="empty-note">Sin gastos este año.</div>';

    let html = headerHtml('Año '+Y);
    html += `<div class="cell anual-ctrl">
      <div class="anual-year"><button class="btn-ghost" id="anPrev" ${yearList.indexOf(String(Y))<=0?'disabled':''}>◀</button><div class="anual-year-n">${Y}</div><button class="btn-ghost" id="anNext" ${yearList.indexOf(String(Y))>=yearList.length-1?'disabled':''}>▶</button></div>
      <div class="filter-chip-row"><div class="fchip ${anualMode==='natural'?'active':''}" data-m="natural">Año natural</div><div class="fchip ${anualMode==='nomina'?'active':''}" data-m="nomina">Por nómina</div></div>
    </div>`;
    html += `<div class="anual-kpis">
      <div class="cell kpi"><div class="kpi-l">Ingresos</div><div class="kpi-v mono" style="color:var(--green);">${fmt(st.ing)}€</div>${delta(st.ing,prev.ing,true)}</div>
      <div class="cell kpi"><div class="kpi-l">Gastos</div><div class="kpi-v mono" style="color:var(--red);">${fmt(st.gas)}€</div>${delta(st.gas,prev.gas,false)}</div>
      <div class="cell kpi"><div class="kpi-l">Ahorro del año</div><div class="kpi-v mono" style="color:${net>=0?'var(--green)':'var(--red)'};">${euro(net)}</div><span class="kpi-d" style="color:var(--muted);">${rate.toFixed(0)}% de lo ingresado</span></div>
      <div class="cell kpi"><div class="kpi-l">Gasto medio / mes</div><div class="kpi-v mono">${fmt(avgGas)}€</div><span class="kpi-d" style="color:var(--muted);">${monthsElapsed} ${monthsElapsed===1?'mes':'meses'} contados</span></div>
    </div>`;
    html += `<div class="anual-grid">
      <div class="chart-wrap">
        <div class="chart-title">Mes a mes <span style="font-weight:400;text-transform:none;letter-spacing:0;">— <span style="color:var(--green);">■</span> ingresos <span style="color:var(--red);">■</span> gastos</span></div>
        ${withData.length ? svg : '<div class="day-chart-empty">Todavía no hay movimientos en este año.</div>'}
      </div>
      <div class="chart-wrap">
        <div class="chart-title">Ahorro acumulado <span style="font-weight:400;text-transform:none;letter-spacing:0;">(ingresos − gastos, desde enero)</span></div>
        ${withData.length ? svg2 : '<div class="day-chart-empty">Todavía no hay movimientos en este año.</div>'}
      </div>
      <div class="cell">
        <div class="section-title" style="margin-bottom:10px;">Gasto por categoría</div>
        ${catHtml}
      </div>
      <div class="cell">
        <div class="section-title" style="margin-bottom:10px;">Meses destacados</div>
        ${best ? `<div class="exp-row" style="border-top:none;padding-top:0;"><div class="exp-name">Mejor mes de ahorro</div><div class="mono" style="font-weight:700;color:var(--green);">${MES3[best.i]} · ${euro(best.net)}</div></div>
        <div class="exp-row"><div class="exp-name">Peor mes</div><div class="mono" style="font-weight:700;color:${worst.net<0?'var(--red)':'var(--ink)'};">${MES3[worst.i]} · ${euro(worst.net)}</div></div>
        <div class="exp-row"><div class="exp-name">Mayor gasto en un mes</div><div class="mono" style="font-weight:700;">${(()=>{ const g=withData.reduce((a,b)=>b.gas>a.gas?b:a); return MES3[g.i]+' · '+fmt(g.gas)+'€'; })()}</div></div>` : '<div class="empty-note">Sin datos todavía.</div>'}
      </div>
      <div class="cell anual-wide">
        <div class="section-title" style="margin-bottom:10px;">Acumulados</div>
        <div class="pivot-wrap"><table class="pivot">
          <thead><tr><th>Mes</th><th>Ingresos</th><th>Gastos</th><th>Neto</th><th>Ahorro acum.</th><th>Saldo cuentas</th></tr></thead>
          <tbody>${rows.map(r=>`<tr><td>${MES3[r.i]}</td><td>${r.ing?fmt(r.ing):'—'}</td><td>${r.gas?fmt(r.gas):'—'}</td><td style="color:${r.net>0?'var(--green)':(r.net<0?'var(--red)':'inherit')};">${(r.ing||r.gas)?fmt(r.net):'—'}</td><td>${r.acc!=null?fmt(r.acc):'—'}</td><td>${r.saldo!=null?fmt(r.saldo):'—'}</td></tr>`).join('')}
          <tr style="font-weight:800;"><td>Total</td><td>${fmt(st.ing)}</td><td>${fmt(st.gas)}</td><td>${fmt(net)}</td><td></td><td></td></tr></tbody>
        </table></div>
        <div class="empty-note" style="padding:8px 0 0;text-align:left;">«Saldo cuentas» suma las cuentas que se calculan solas (las manuales, como inversiones, no entran). Los movimientos entre cuentas no cuentan como gasto ni ingreso.</div>
      </div>
    </div>`;
    $app.innerHTML = html;
    document.getElementById('anPrev').onclick = ()=>{ const i = yearList.indexOf(String(Y)); if(i>0){ anualYear = parseInt(yearList[i-1],10); renderAnual(); } };
    document.getElementById('anNext').onclick = ()=>{ const i = yearList.indexOf(String(Y)); if(i<yearList.length-1){ anualYear = parseInt(yearList[i+1],10); renderAnual(); } };

  // ================= CUENTA / LOGIN =================
  let sb = null, me = null, authEmail = '', loadedUserId = null;
  const AUTH_FN = 'cuentas-auth';
  const LEGACY_KEY = 'cuentas-data-v1';
  let legacyLocal = null; // datos antiguos de este dispositivo (antes del login)
  let authLockQueue = Promise.resolve();
  function authLock(name, timeout, fn){
    const prev = authLockQueue;
    const wait = Promise.race([prev.catch(()=>{}), new Promise(r=> setTimeout(r, 4000))]);
    const run = wait.then(()=> fn());
    authLockQueue = run.catch(()=>{});
    return run;
  }
  function initSb(){
    if(sb) return sb;
    if(!window.supabase) return null;
    sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, { auth:{ lock: authLock } });
    sb.auth.onAuthStateChange(ev=>{
      if(ev==='SIGNED_OUT' && me && !loggingOut){ showToast('Tu sesión ha caducado. Vuelve a entrar.'); setTimeout(()=>location.reload(), 800); }
    });
    return sb;
  }
  let loggingOut = false;
  function readLegacy(){
    try{ const raw = localStorage.getItem(LEGACY_KEY); if(raw) legacyLocal = JSON.parse(raw); }catch(e){}
  }
  const RE_USER = /^[a-z0-9_]{3,20}$/, RE_MAIL = /^[^\s@]+@[^\s@]+\.[^\s@]+$/, RE_CODE = /^\d{6,10}$/;
  const cleanUser = v => String(v||'').normalize('NFKC').replace(/[\s​-‍﻿-]+/g,'').toLowerCase().replace(/^@/,'');
  function translateAuthError(e){
    const m = String((e && (e.message||e.error_description||e.code)) || e || '').toLowerCase();
    if(/failed to fetch|network|load failed/.test(m)) return 'No hay conexión con el servidor ahora mismo. Inténtalo en un rato.';
    if(/invalid login credentials/.test(m)) return 'Usuario o contraseña incorrectos.';
    if(/already registered/.test(m)) return 'Ese usuario ya está registrado.';
    if(/rate|seconds|too many/.test(m)) return 'Demasiados intentos. Espera un minuto y vuelve a probar.';
    if(/smtp|sending|error sending/.test(m)) return 'No se ha podido enviar el correo ahora mismo. Inténtalo en un rato.';
    if(/email not confirmed/.test(m)) return 'Tienes que confirmar el correo antes de entrar.';
    if(/invalid.*email|email.*invalid/.test(m)) return 'Ese correo no parece válido.';
    if(/expired|invalid|otp|token/.test(m)) return 'El código no es correcto o ha caducado.';
    return 'Algo ha fallado: '+(e && e.message ? e.message : m);
  }
  async function nfAuth(action, payload){
    try{
      const { data, error } = await sb.functions.invoke(AUTH_FN, { body: Object.assign({action}, payload) });
      if(error) return { error:'unavailable' };
      return data || { error:'unavailable' };
    }catch(e){ return { error:'unavailable' }; }
  }
  async function fetchProfile(authId){
    const ck = 'cuentas-profile-'+authId;
    try{
      const { data, error } = await sb.from('cuentas_perfiles').select('id,username').eq('auth_user_id', authId).maybeSingle();
      if(error) throw error;
      if(data){ try{ localStorage.setItem(ck, JSON.stringify(data)); }catch(e){} }
      return data;
    }catch(e){
      try{ const c = localStorage.getItem(ck); if(c) return JSON.parse(c); }catch(_){}
      return null;
    }
  }

    const title = {login:'Entrar', signup1:'Crear cuenta', signup2:'Confirma tu correo', signup3:'Elige tu contraseña', rec1:'Recuperar contraseña', rec2:'Contraseña nueva'}[v];

    const busy = (b, on, txt)=>{ if(!b) return; b.disabled = on; if(txt!==undefined){ if(on){ b._t = b.textContent; b.textContent = txt; } else if(b._t) b.textContent = b._t; } };
    $app.querySelectorAll('[data-go]').forEach(el=> el.onclick = ()=>{ saveFields(); authForm.err=''; renderLogin(el.dataset.go); });
    function saveFields(){
      if($('aId')) authForm.id = $('aId').value;
      if($('aUser')) authForm.user = $('aUser').value;

    ['aId','aPw','aUser','aMail','aLegacy','aCode','aPw1','aPw2'].forEach(id=>{ const el=$(id); if(el) el.addEventListener('keydown', e=>{ if(e.key==='Enter'){ e.preventDefault(); go && go.click(); } }); });
    if(!sb && go){ setErr('No se ha podido cargar el sistema de cuentas. Comprueba la conexión y recarga.'); }

    if(v==='login') go.onclick = async ()=>{
      const raw = $('aId').value.trim(), pw = $('aPw').value;

      if(!raw || !pw){ setErr('Escribe tu usuario (o correo) y tu contraseña.'); return; }
      busy(go, true, 'Entrando…');
      try{
        const isMail = raw.includes('@') && !raw.startsWith('@');
        let res;
        if(isMail){
          res = await sb.auth.signInWithPassword({ email: raw.toLowerCase(), password: pw });
          if(res.error && /invalid login/i.test(res.error.message) && pw!==pw.trim()) res = await sb.auth.signInWithPassword({ email: raw.toLowerCase(), password: pw.trim() });
        } else {

          let r = await nfAuth('login', { username: uname, password: pw });
          if(r.error==='invalid' && pw!==pw.trim()) r = await nfAuth('login', { username: uname, password: pw.trim() });

          else if(r.error==='rate_limit') res = { error:{ message:'rate limit' } };
          else if(r.error==='unavailable'){

    if(v==='rec2'){

          try{ localStorage.setItem('cuentas-email-'+prof.username, user.email); }catch(e){}

          await enterApp(prof, {});
        }catch(e){ busy(go,false); setErr(translateAuthError(e)); }

    }

  // ---------- entrar en la app con una cuenta ----------
  async function enterApp(profile, opts){
    opts = opts || {};
    if(loadedUserId && loadedUserId !== profile.id){ location.reload(); return; }
    me = profile; loadedUserId = profile.id;
    STORAGE_KEY = 'cuentas-data-u-'+profile.id;
    state = JSON.parse(JSON.stringify(DEFAULT_STATE));
    await loadState();
    if(!authEmail){ try{ const s = await sb.auth.getSession(); authEmail = (s.data.session && s.data.session.user.email) || ''; }catch(e){} }
    let remote;
    try{ remote = await pullFromCloud(); }catch(e){ remote = undefined; } // undefined = sin conexión
    if(remote === null && !state.onboarded){
      const code = (opts.legacyCode || '').trim() || (legacyLocal && legacyLocal.syncCode) || '';
      let done = false;
      if(code){
        try{
          const r = await sb.rpc('cuentas_reclamar_antiguo', { p_code: code });
          if(r.data && r.data.ok){
            state = Object.assign(JSON.parse(JSON.stringify(DEFAULT_STATE)), r.data.data);
            state.syncCode = ''; state.onboarded = true;
            try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }catch(e){}
            showToast('Tus datos de «'+code+'» están en tu cuenta');
            done = true; legacyLocal = null;
            try{ localStorage.removeItem(LEGACY_KEY); }catch(e){}
          } else if(opts.legacyCode){
            showToast(r.data && r.data.motivo==='ya_reclamado' ? 'Ese código ya está en otra cuenta' : 'No se han encontrado datos con ese código');
          }
        }catch(e){}
      }
      if(!done && legacyLocal && legacyLocal.onboarded && legacyLocal.transactions){
        if(confirm('Hay datos de Cuentas guardados en este dispositivo.\n\n¿Son tuyos? Aceptar = ponerlos en tu cuenta. Cancelar = empezar de cero.')){
          state = Object.assign(JSON.parse(JSON.stringify(DEFAULT_STATE)), legacyLocal);
          state.syncCode = ''; state._updatedAt = Date.now();
          try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }catch(e){}
          await pushToCloud();
          legacyLocal = null;
          try{ localStorage.removeItem(LEGACY_KEY); }catch(e){}
        }
      }
    } else if(remote !== undefined){
      await syncWithCloud();
    }
    initTokenPrefetch();
    render();
  }
  function initTokenPrefetch(){ /* reservado */ }

  async function doLogout(){
    if(!confirm('¿Cerrar sesión en este dispositivo?')) return;
    loggingOut = true;
    try{ await sb.auth.signOut(); }catch(e){}
    location.reload();
  }

  // ---------- hojas de Ajustes: correo, contraseña, clave del atajo ----------
  function sheetErr(t){ const e = $sheet.querySelector('.auth-err'); if(e) e.textContent = t||''; }
  function openChangeEmail(){
    $sheet.innerHTML = `<h2>Cambiar el correo</h2>
      <div class="field"><label>Correo nuevo</label><input type="email" id="ceMail" autocapitalize="off"></div>
      <div id="ceCodeBox" style="display:none;"><div class="auth-note" style="margin-top:0;">Te hemos enviado un código al correo nuevo.</div>
        <div class="field"><label>Código</label><input type="text" id="ceCode" inputmode="numeric" autocomplete="one-time-code" maxlength="10" class="mono-input"></div></div>
      <div class="auth-err"></div>
      <button class="btn-primary" id="ceGo">Enviarme un código</button>
      <button class="btn-ghost" id="ceCancel" style="margin-top:8px;">Cancelar</button>`;
    $overlay.classList.add('show');
    let step = 1, mail = '';
    $sheet.querySelector('#ceCancel').onclick = ()=> $overlay.classList.remove('show');
    $sheet.querySelector('#ceGo').onclick = async (ev)=>{
      const b = ev.target; b.disabled = true;
      try{
        if(step===1){
          mail = $sheet.querySelector('#ceMail').value.trim().toLowerCase();
          if(!RE_MAIL.test(mail)) throw { message:'invalid email' };
          const { data, error } = await sb.auth.updateUser({ email: mail });
          if(error) throw error;
          if(data.user && data.user.email === mail){ authEmail = mail; $overlay.classList.remove('show'); showToast('Correo guardado'); renderAjustes(); return; }
          step = 2; $sheet.querySelector('#ceCodeBox').style.display = 'block'; b.textContent = 'Confirmar'; sheetErr('');
        } else {
          const code = $sheet.querySelector('#ceCode').value.trim();
          if(!RE_CODE.test(code)) throw { message:'invalid otp' };
          const { error } = await sb.auth.verifyOtp({ email: mail, token: code, type:'email_change' });
          if(error) throw error;
          await sb.auth.refreshSession();
          const s = await sb.auth.getSession();
          const now = s.data.session && s.data.session.user.email;
          if(now !== mail) throw { message:'El correo no ha cambiado. En Supabase hay que desactivar «Secure email change».' };
          authEmail = mail;
          try{ localStorage.setItem('cuentas-email-'+me.username, mail); }catch(e){}
          $overlay.classList.remove('show'); showToast('Correo cambiado'); renderAjustes(); return;
        }
      }catch(e){ sheetErr(translateAuthError(e)); }
      b.disabled = false;
    };
  }

    $sheet.innerHTML = `<h2>Cambiar la contraseña</h2>
      <div class="field"><label>Contraseña actual</label><input type="password" id="cpOld" autocomplete="current-password"></div>
      <div class="field"><label>Contraseña nueva (mínimo 6)</label><input type="password" id="cpNew" autocomplete="new-password"></div>
      <div class="field"><label>Repite la contraseña nueva</label><input type="password" id="cpNew2" autocomplete="new-password"></div>
      <div class="auth-err"></div>
      <button class="btn-primary" id="cpGo">Cambiar contraseña</button>
      <button class="btn-ghost" id="cpCancel" style="margin-top:8px;">Cancelar</button>`;
    $overlay.classList.add('show');
    $sheet.querySelector('#cpCancel').onclick = ()=> $overlay.classList.remove('show');
    $sheet.querySelector('#cpGo').onclick = async (ev)=>{
      const b = ev.target;
      const o = $sheet.querySelector('#cpOld').value, n = $sheet.querySelector('#cpNew').value, n2 = $sheet.querySelector('#cpNew2').value;
      if(!o){ sheetErr('Escribe tu contraseña actual.'); return; }
      if(n.length<6){ sheetErr('La nueva tiene que tener al menos 6 caracteres.'); return; }
      if(n!==n2){ sheetErr('Las dos contraseñas nuevas no coinciden.'); return; }
      if(n===o){ sheetErr('La nueva tiene que ser distinta de la actual.'); return; }
      b.disabled = true;
      try{
        const s = await sb.auth.getSession();
        const mail = s.data.session && s.data.session.user.email;
        const chk = await sb.auth.signInWithPassword({ email: mail, password: o });
        if(chk.error){ sheetErr('La contraseña actual no es correcta.'); b.disabled = false; return; }
        const { error } = await sb.auth.updateUser({ password: n });
        if(error) throw error;
        $overlay.classList.remove('show'); showToast('Contraseña cambiada');
      }catch(e){ sheetErr(translateAuthError(e)); b.disabled = false; }
    };
  }
  async function openShortcutKey(){
    $sheet.innerHTML = `<h2>Clave del Atajo</h2>
      <div class="auth-note" style="margin-top:0;">Es lo que va en el Atajo de iOS (el campo <b>p_code</b>) para que tus gastos entren en TU cuenta. No se la des a nadie.</div>
      <div class="mono" id="skVal" style="font-weight:700;font-size:13px;word-break:break-all;margin:12px 0;">…</div>
      <div class="auth-err"></div>
      <button class="btn-primary" id="skCopy">Copiar</button>
      <button class="btn-secondary" id="skNew" style="margin-top:8px;">Generar una clave nueva</button>
      <button class="btn-ghost" id="skClose" style="margin-top:8px;">Cerrar</button>`;
    $overlay.classList.add('show');
    const load = async (regen)=>{
      try{ const { data, error } = await sb.rpc('cuentas_atajo_token', { p_regenerar: !!regen }); if(error) throw error; $sheet.querySelector('#skVal').textContent = data; }
      catch(e){ sheetErr(translateAuthError(e)); }
    };
    await load(false);
    $sheet.querySelector('#skClose').onclick = ()=> $overlay.classList.remove('show');
    $sheet.querySelector('#skCopy').onclick = async ()=>{ try{ await navigator.clipboard.writeText($sheet.querySelector('#skVal').textContent); showToast('Copiada'); }catch(e){ showToast('Mantén pulsada la clave para copiarla'); } };
    $sheet.querySelector('#skNew').onclick = async ()=>{
      if(!confirm('La clave actual dejará de funcionar y tendrás que ponerla en el Atajo. ¿Generar una nueva?')) return;
      await load(true); showToast('Clave nueva generada');
    };
  }

  // ================= ROOT RENDER =================
  function render(){
    if(!me){ renderLogin(); return; }
    if(!state.onboarded){ renderOnboarding(); return; }
    $tabbarWrap.style.display = 'flex';
    document.body.classList.toggle('wide', activeTab==='anual' || activeTab==='dashboard');
    renderTabbar();
    if(activeTab==='resumen') renderResumen();
    else if(activeTab==='insertar') renderInsertar();
    else if(activeTab==='dashboard') renderDashboard();
    else if(activeTab==='anual') renderAnual();
    else renderAjustes();
  }

  // ---------- sincronización en directo ----------
  // Cada pocos segundos (y al volver a la app) mira si hay algo más nuevo en la nube
  // (p.ej. un movimiento añadido desde el Atajo) y lo trae sin que haya que salir y entrar.
  let liveBusy = false, lastLiveCheck = 0;
  function userIsEditing(){
    if($overlay.classList.contains('show')) return true;
    const a = document.activeElement;
    return !!(a && (a.tagName==='INPUT' || a.tagName==='TEXTAREA' || a.tagName==='SELECT'));
  }
  async function liveCheck(force){
    if(document.visibilityState!=='visible' || !me || !state.onboarded) return;
    if(liveBusy || syncTimer) return;                       // hay una subida pendiente o una comprobación en curso
    if(!force && Date.now()-lastLiveCheck < 3000) return;
    if(userIsEditing()) return;                             // no pisar lo que se está escribiendo
    liveBusy = true; lastLiveCheck = Date.now();
    try{
      const { data, error } = await sb.from('cuentas_data').select('updated_at').eq('user_id', me.id).maybeSingle();
      if(!error){
        const remoteTime = data ? new Date(data.updated_at).getTime() : 0;
        if(remoteTime > (state._updatedAt||0) && !userIsEditing() && !syncTimer){
          const r = await syncWithCloud();
          if(r==='pulled' && !userIsEditing()) render();
        }
      }
    }catch(e){ /* sin conexión: se reintenta en el siguiente ciclo */ }
    liveBusy = false;
  }
  document.addEventListener('visibilitychange', ()=>liveCheck(true));
  window.addEventListener('pageshow', ()=>liveCheck(true));
  window.addEventListener('focus', ()=>liveCheck(true));
  setInterval(()=>liveCheck(false), 5000);

  (async function init(){
    readLegacy();
    if(!initSb()){ renderLogin('login','No se ha podido cargar el sistema de cuentas. Comprueba la conexión y recarga la página.'); return; }
    let session = null;
    try{
      const r = await Promise.race([sb.auth.getSession(), new Promise(res=> setTimeout(()=>res(null), 8000))]);
      session = r && r.data && r.data.session;
    }catch(e){}
    if(session){
      authEmail = session.user.email || '';
      const prof = await fetchProfile(session.user.id);
      if(prof){ await enterApp(prof, {}); return; }
      try{ await sb.auth.signOut(); }catch(e){}
    }
    renderLogin('login');
  })();
})();
</script>
</body>
</html>
